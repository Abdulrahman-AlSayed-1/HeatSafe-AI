spring:
  application:
    name: heatsafe-ai
  
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/heatsafe}
    username: ${DATABASE_USERNAME:heatsafe}
    password: ${DATABASE_PASSWORD:heatsafe}
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  
  flyway:
    enabled: true
    locations: classpath:db/migration
  
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:ollama}
      base-url: ${OPENAI_BASE_URL:http://127.0.0.1:11434/v1}
      chat:
        endpoint: ${AI_ENDPOINT:${OPENAI_BASE_URL:http://127.0.0.1:11434/v1}/chat/completions}
        options:
          model: ${AI_MODEL:llama3.1}

server:
  port: ${PORT:${SERVER_PORT:8080}}
  error:
    include-message: always
    include-binding-errors: always

fortyguard:
  api-key: ${FORTYGUARD_API_KEY:}
  base-url: ${FORTYGUARD_BASE_URL:https://api.fortyguard.com}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    com.heatsafe: DEBUG
    org.springframework.web: INFO

services:
  - type: web
    name: heatsafe-backend
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DATABASE_URL
        fromDatabase:
          name: heatsafe-db
          property: connectionString
      - key: DATABASE_USERNAME
        fromDatabase:
          name: heatsafe-db
          property: user
      - key: DATABASE_PASSWORD
        fromDatabase:
          name: heatsafe-db
          property: password
      - key: FORTYGUARD_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false

databases:
  - name: heatsafe-db
    plan: free
    databaseName: heatsafe
    user: heatsafe
